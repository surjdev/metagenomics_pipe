[project]
name = "metagenomics-pipeline"
version = "0.1.0"
description = "Hybrid Short/Long-Read Metagenomics Pipeline"
authors = ["Your Name <your-email@example.com>"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[dependencies]
# --- Core Runtimes & Dev Tools (Section 1) ---
nextflow = ">=23.10"
openjdk = ">=17"     # Java 17+ runtime required by Nextflow
nf-core = "*"        # Recommended for linting and schema validation

# --- Python Helper Script Environment (Section 8) ---
python = "3.11.*"
pandas = "*"
biom-format = "*"    # Required for handling BIOM tables

# --- R Helper Script Environment (Section 8) ---
r-base = ">=4.4"
bioconductor-phyloseq = "*"
r-vegan = "*"
r-ggplot2 = "*"

[tasks]
# Context-aware environment shell entry
shell = "bash"

# Section 9: Validate subworkflow DAGs quickly before running tools
stub-run = "nextflow run main.nf -stub-run"

# Section 9: Run with the tiny test dataset and Docker
test = "nextflow run main.nf -profile test,docker -resume"

# Section 10: Run the primary workflow (update parameters as needed)
run-workflow = "nextflow run main.nf -profile docker -resume --outdir results"