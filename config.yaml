# Example pipeline configuration. Copy and edit per project.

samples: samples.csv        # CSV manifest: sample_id,fastq_1,fastq_2
output_dir: results
threads: 8

qc:
  enabled: true              # FastQC on raw reads

trimming:
  enabled: true               # fastp adapter/quality trimming
  extra_args: ""              # e.g. "--length_required 50"

host_removal:
  enabled: false              # requires a prebuilt Bowtie2 index of the host genome
  host_index: ""              # path prefix to bowtie2-build output, e.g. /refs/GRCh38/GRCh38

taxonomy:
  enabled: true                # Kraken2 classification + Bracken abundance re-estimation
  kraken2_db: ""                # path to a Kraken2 database directory
  confidence: 0.1
  bracken_read_len: 150
  bracken_level: S              # S=species, G=genus, F=family, ...

assembly:
  enabled: false                # MEGAHIT de novo assembly (slow, off by default)
  min_contig_len: 500

report:
  enabled: true                 # aggregate everything with MultiQC
